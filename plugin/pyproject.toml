[project]
name = "beets-beetsfs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["beets[chroma]>=2.14"]  # chroma: acoustic fingerprints (pyacoustid, runs fpcalc)

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beetsplug"]
