[project]
name = "beets-beetsfs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["beets[chroma,lyrics]>=2.14"]  # chroma: fingerprints (pyacoustid, fpcalc); lyrics: LRCLIB (bs4)

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beetsplug"]
