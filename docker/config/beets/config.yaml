directory: /beetsfs/music  # where the view is; only used to compute relative paths
library: /config/beets/library.db
import:
  copy: no
  move: no
  write: no                    # also the default for `beet modify`
  incremental: yes
  incremental_skip_later: yes  # skipped albums are not remembered: the next import asks again
paths:
  default:   $albumartist/$album%aunique{}/$track $title
  comp:      $albumartist/$album%aunique{}/$track $title
  singleton: $artist/Singles/$title
plugins: [musicbrainz, chroma, edit, beetsfs] # musicbrainz: metadata source; chroma: acoustic fingerprints; edit: `beet edit <query>`
