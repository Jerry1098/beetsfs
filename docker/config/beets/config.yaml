directory: /beetsfs/music  # where the view is; only used to compute relative paths
library: /config/beets/library.db
import:
  copy: no
  move: no
  write: no                    # also the default for `beet modify`
  incremental: yes
  incremental_skip_later: yes  # skipped albums are not remembered: the next import asks again
item_fields:  # inline plugin: on multi-disc albums a disc prefix, "2-01 Title"
  discprefix: f"{disc}-" if disctotal > 1 else ""
paths:
  default:   $albumartist/$album%aunique{}/$discprefix$track $title
  comp:      $albumartist/$album%aunique{}/$discprefix$track $title
  singleton: $artist/Singles/$title
plugins: [musicbrainz, chroma, edit, inline, lyrics, beetsfs] # musicbrainz: metadata source; chroma: acoustic fingerprints; edit: `beet edit <query>`; inline: item_fields; lyrics: below
lyrics:  # stored in beets' database; beetsfs embeds them in the view files (no .lrc files needed)
  sources: [lrclib]  # the source LRCGET uses
  synced: yes        # time-synced LRC lyrics when available
  auto: yes          # fetch during imports; `beet lyrics` for what is already in the library
