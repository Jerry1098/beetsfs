# Build the image on every push to main and push it to ghcr.io/<owner>/<repo>:latest.
name: container

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # push to ghcr.io with the workflow's own GITHUB_TOKEN

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3 # BuildKit: the Dockerfile uses COPY --chmod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (ghcr wants it lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
